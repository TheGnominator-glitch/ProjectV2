<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universidad Libre | Sistema de Estudiantes</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <h1>Sistema de Gestión de Estudiantes</h1>
        <p class="subtitulo">Universidad Libre - Proyecto Cliente-Servidor</p>

        <!-- Formulario para crear/actualizar -->
        <div class="form-container">
            <h2 id="form-title">Agregar Nuevo Estudiante</h2>
            <form id="estudiante-form">
                <div class="form-group">
                    <label for="estudiante-id">Id (opcional, se genera automáticamente):</label>
                    <input type="number" id="estudiante-id" min="1" placeholder="Dejar vacío para asignar automáticamente">
                </div>

                <div class="form-group">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" required>
                </div>

                <div class="form-group">
                    <label for="apellido">Apellido:</label>
                    <input type="text" id="apellido" required>
                </div>

                <div class="form-group">
                    <label for="edad">Edad:</label>
                    <input type="number" id="edad" min="15" max="100" required>
                </div>

                <div class="form-group">
                    <label for="carrera">Carrera:</label>
                    <input type="text" id="carrera" required>
                </div>

                <div class="button-group">
                    <button type="submit" id="submit-btn">Agregar Estudiante</button>
                    <button type="button" id="cancel-btn" style="display:none;">Cancelar</button>
                </div>
            </form>
        </div>

        <!-- Tabla de estudiantes -->
        <div class="table-container">
            <h2>Lista de Estudiantes</h2>
            <table id="estudiantes-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Apellido</th>
                        <th>Edad</th>
                        <th>Carrera</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="estudiantes-tbody">
                    <!-- Se llenará dinámicamente -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
